[build]
  command = "npm ci && npx vite build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Renewal reminders are now surfaced in-app instead of auto-emailed.
# The renewal-reminder function code is still here in case we want to bring
# scheduled sending back — just add:
#   [functions."renewal-reminder"]
#     schedule = "0 13 * * *"
